apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VA-LEKSEEVA/final-app.git
    targetRevision: main
    helm:
      values: |
        controller:
          kind: DaemonSet
          hostPort:
            enabled: false
          service:
            type: NodePort
          nodeSelector:
            kubernetes.io/os: linux
    path: platform-charts/ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
